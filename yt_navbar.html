<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Navbar</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background-color:#f9f9f9;
    }

    .navbar{
      height:100px;
      width:100%;
      background-color:white;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:0 20px;
      border-bottom:1px solid #ddd;
    }

    /* Left Side */
    .left{
      display:flex;
      align-items:center;
      gap:20px;
    }

    .menu{
      font-size:24px;
      cursor:pointer;
    }

    .logo{
      color:red;
      font-size:24px;
      font-weight:bold;
    }

    /* Center */
    .center{
      display:flex;
      align-items:center;
      width:50%;
    }

    .search-box{
      width:100%;
      height:40px;
      padding-left:15px;
      border:1px solid #ccc;
      border-radius:20px 0 0 20px;
      outline:none;
    }

    .search-btn{
      height:40px;
      width:60px;
      border:1px solid #ccc;
      border-left:none;
      background-color:#f0f0f0;
      border-radius:0 20px 20px 0;
      cursor:pointer;
    }

    /* Right Side */
    .right{
      display:flex;
      align-items:center;
      gap:20px;
      font-size:22px;
      cursor:pointer;
    }

    .profile{
      width:35px;
      height:35px;
      background-color:blue;
      border-radius:50%;
    }
  </style>
</head>
<body>

  <div class="navbar">

    <!-- Left -->
    <div class="left">
      <div class="menu">☰</div>
      <div class="logo">YouTube</div>
    </div>

    <!-- Center -->
    <div class="center">
      <input type="text" placeholder="Search" class="search-box">
      <button class="search-btn">🔍</button>
    </div>

    <!-- Right -->
    <div class="right">
      <div>📹</div>
      <div>🔔</div>
      <div class="profile"></div>
    </div>

  </div>

</body>
</html>
