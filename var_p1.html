<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            /* top */
           --hg-top:500px;
           --wd-top:680px;
           --mgt-top:100px;
           --mgl-top:200px;
           --dis-in:inline-block;
           --bo-so:3px solid black;
        }
        .main{
           height: var(--hg-top);
           width:var(--wd-top);
    
           margin-top: var(--mgt-top);
           margin-left:var(--mgl-top);
           display: var(--dis-in);
           border: var(--bo-so);
        }
        .top{
            height: 100px;
            width:600px;
            background-color: rgb(255, 166, 0);
            margin-top: 30px;
            margin-left: 40px;
            display: inline-block;
             border: 3px solid black;                                                                                                                                                                                                                          
        }
        .m1{
            height: 100px;
            width:190px;
           background-color:white;
            margin-top: 20px;
            margin-left: 40px;
            display: inline-block;
             border: 3px solid black;
        }
        .m2{
            height: 100px;
            width:190px;
            background-color: white;
            margin-top: 20px;
            margin-left: 10px;
            display: inline-block;
             border: 3px solid black;
        }
        .m3{
             height: 100px;
            width:185px;
            background-color: white;
            margin-top: 20px;
            margin-left: 10px;
            display: inline-block;
             border: 3px solid black;
        }
        .b1{
            height: 150px;
            width:150px;
            margin-top: 20px;
            margin-left: 40px;
            display: inline-block;
            border-radius: 50%;
             border: 3px solid black;
             background-color:chartreuse;
        }
        .b2{
            height: 100px;
            width:400px;
        
            margin-top: 50px;
            margin-left: 40px;
            display: inline-block; 
            vertical-align: top;
             border: 3px solid black;
             background-color:chartreuse;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="top"></div>
        <div class="m1"></div>
        <div class="m2"></div>
        <div class="m3"></div>
        <div class="b1"></div>
        <div class="b2"></div>
    </div>
</body>
</html>
